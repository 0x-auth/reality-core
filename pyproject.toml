[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-core"
version = "0.1.0"
description = "The Mobius-dynamics engine behind the Reality game and darmiyan-fs — zero dependencies, a terminal game, and a trust-free verifier."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "bitsabhi", email = "bits.abhi@gmail.com" }]
requires-python = ">=3.8"
keywords = ["mobius", "dynamics", "game", "verification", "math"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/0x-auth/reality-core"
"Related work" = "https://github.com/0x-auth/darmiyan-fs"

[project.scripts]
reality = "reality_core.cli:main"

[tool.setuptools]
packages = ["reality_core"]
